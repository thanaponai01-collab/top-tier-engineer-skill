name: gates

on:
  push:
    branches: [main]
  pull_request:

jobs:
  gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.x'

      # The suite's tools gate their own correctness.
      - name: tests
        run: python3 tools/test_tools.py

      # The debt ratchet: fail on new or worsened breaches, never on accepted ones.
      - name: structure
        run: python3 tools/structure-report.py --baseline .structure-baseline.json --require-debt-ledger .

      # Every file the live surface names must exist. This is the defect class 2.0.0
      # shipped: docs kept citing tools that had been deleted. CHANGELOG.md, runs/ and
      # DECISION_LEDGER.md are history and are meant to name files that are gone.
      - name: references
        run: bash tools/check-references.sh

      # plugin.json owns the version; the marketplace entry's copy was deleted in 2.6.1 (D010).
      # CHANGELOG.md's newest heading is the one remaining copy and cannot be deleted — it is the
      # human record — so it is gated. A fact duplicated across files needs a gate, not a habit.
      - name: version
        run: |
          a=$(python3 -c "import json;print(json.load(open('.claude-plugin/plugin.json'))['version'])")
          c=$(grep -m1 -oE '^## [0-9]+\.[0-9]+\.[0-9]+' CHANGELOG.md | cut -d' ' -f2)
          [ "$a" = "$c" ] || { echo "version drift: plugin.json $a != CHANGELOG.md $c"; exit 1; }
          python3 -c "import json,sys; e=json.load(open('.claude-plugin/marketplace.json'))['plugins'][0]; sys.exit('marketplace.json re-added the version key (D010)') if 'version' in e else None"
