name: enforcement-floor

# The mechanical enforcement floor for the top-tier-engineer suite.
#
# WHY THIS EXISTS
# ---------------
# Every anti-spaghetti rule in this suite is prose the agent is asked to follow.
# Prose drifts — across a long session, a tired context window, a model swap. When
# it drifts there has been NO detector: the report says (proven), the code looks
# done, and spaghetti ships unseen. This workflow is the wall that does not drift.
# A machine says no regardless of what any agent claims — which is the whole point
# of the suite's evidence vocabulary: narrators are not to be trusted on their own
# word.
#
# WHAT IT ENFORCES
# ----------------
#   0. test_tools.py       — the suite tools gate their own correctness (stdlib
#                            unittest) before any of them is trusted to judge the repo.
#   1. verdict-lint.py     — PROTOCOL §5 verdict-line FORM on any run transcript
#                            committed under run-logs/ or *_RUN_*.md (form, not merit).
#   2. structure-report.py — STRUCTURAL shape of the source: complexity, nesting,
#                            god-files, import cycles, duplication (the spaghetti alarm).
#   3. run-trace.py        — run-completeness on committed transcripts (did the stages
#                            actually execute).
#
# Any tool exiting non-zero FAILS the check and blocks the merge. That is the
# difference between "doctrine I hope the agent followed" and "an engineer plus a CI
# that catches it when it didn't."
#
# READABLE BY A NON-CODER
# -----------------------
# The job writes a plain-language summary to the GitHub Step Summary, so the result
# is "✅ no spaghetti / ⚠️ review needed" in words — not a log you must read code to
# parse.

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  enforcement-floor:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Optional richer linters — structure-report.py NOTES them if present and the
      # harness may escalate; it never hard-depends on them, so install is best-effort.
      - name: Install optional richer linters (best-effort)
        run: pip install radon ruff || true

      # ---- GATE 0: the tools gate their own correctness ----------------------
      # test_tools.py exercises every suite tool through its real CLI (stdlib
      # unittest, no deps). If a tool regresses, this fails before any tool is
      # trusted to judge the repo below.
      - name: Tool self-tests
        run: python3 tools/test_tools.py

      # The Stop hook is a tool too, and it had no CI coverage at all — which is how
      # two root-resolution defects and a stderr-encoding bug survived in it. Its
      # selftest exercises the hook payload path end to end.
      - name: Stop-hook selftest
        run: python3 tools/stop-gate.py --selftest

      # ---- GATE 1: structural quality (the spaghetti alarm + the debt ratchet) --
      # Ratchet mode when a baseline exists (PROTOCOL §10): accepted debt is frozen,
      # and the gate fails only on a breach that is NEW or one that got WORSE. This
      # is what keeps the gate alive on a codebase that already has debt — before the
      # baseline existed this very step was red on main for two long-standing
      # graph-audit.py findings, and a permanently-red gate is a disabled gate.
      # --require-debt-ledger refuses a baseline whose files have no DEBT_LEDGER.md
      # row: debt you did not write down is amnesty, not acceptance.
      - name: Structural-quality gate
        id: structure
        run: |
          if [ -f .structure-baseline.json ]; then
            echo "Ratcheting structural shape against the accepted baseline…"
            python3 tools/structure-report.py \
              --baseline .structure-baseline.json \
              --require-debt-ledger . | tee structure.out
          else
            echo "No baseline present — reporting absolute structural shape…"
            python3 tools/structure-report.py . | tee structure.out
          fi
          code=${PIPESTATUS[0]}
          echo "structure_exit=$code" >> "$GITHUB_OUTPUT"
          exit $code

      # ---- GATE 2: verdict-line form on any committed run transcripts ---------
      # Lints everything under runs/ (this suite's own evidence base) and under
      # run-logs/ (the convention for repos that consume the suite), plus any
      # *_RUN_*.md elsewhere. A repo with no transcripts passes vacuously —
      # verdict-lint treats "no verdict lines" as a soft pass — so this never
      # blocks repos that don't keep run logs in-tree.
      #
      # HISTORY, so it is not re-broken: until v1.17.0 these two gates globbed
      # `run-logs/`, a directory this repo has never had, while the actual evidence
      # lived in `runs/` — which `.gitignore` also excluded. Both gates therefore
      # printed "passes vacuously" on every run and *could not fail*, while four
      # transcripts failed run-trace locally. A gate pointed at a path that cannot
      # contain anything is not a floor; it is a green light with no bulb.
      - name: Verdict-line form gate
        if: always()
        run: |
          shopt -s nullglob globstar
          targets=( runs/**/*.md run-logs/**/*.md **/*_RUN_*.md )
          if [ ${#targets[@]} -eq 0 ]; then
            echo "No run transcripts found to lint — gate passes vacuously."
            exit 0
          fi
          rc=0
          mapfile -t files < <(printf '%s\n' "${targets[@]}" | sort -u)
          for f in "${files[@]}"; do
            echo "── verdict-lint: $f"
            python3 tools/verdict-lint.py "$f" || rc=1
          done
          exit $rc

      # ---- GATE 3: run-completeness on any committed transcripts ---------------
      # Exit 2 from run-trace means "no verdict lines at all" — a report, a patch
      # file, an index. Those legitimately live alongside transcripts, so exit 2 is
      # SKIPPED, not failed; only exit 1 (a classified run missing a required stage)
      # blocks. This mirrors verdict-lint's existing soft-pass on the same condition.
      #
      # TWO TRAPS, both paid for once (v1.17.0 scrutinize gate):
      # 1. Actions runs `run:` under `bash -e {0}`. A bare `python3 …; code=$?` ABORTS
      #    the step on the first non-zero exit, so the skip branch below would never be
      #    reached and this gate would hard-fail on the commit that un-vacuumed it. The
      #    `|| code=$?` form puts the call in a condition context, which suppresses -e —
      #    that is why the older `|| rc=1` shape worked and a "clearer" rewrite did not.
      # 2. Exit 2 is overloaded: argparse also exits 2 on a USAGE error, so a typo in a
      #    future flag would read as "not a transcript" and skip everything silently
      #    while reporting green. Defence: the output is printed on EVERY path, so a
      #    usage error is visible in the log even when its file is skipped.
      - name: Run-completeness gate
        id: runtrace
        if: always()
        run: |
          shopt -s nullglob globstar
          targets=( runs/**/*.md run-logs/**/*.md **/*_RUN_*.md )
          if [ ${#targets[@]} -eq 0 ]; then
            echo "No run transcripts to trace — gate passes vacuously."
            echo "runtrace_exit=0" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          rc=0
          # Scratch output goes to the runner's temp dir, never the workspace: a scratch
          # file written next to the source is one `git add -A` away from being committed,
          # which is exactly how a stray trace.out rode into v1.17.0.
          out="${RUNNER_TEMP:-/tmp}/run-trace.out"
          mapfile -t files < <(printf '%s\n' "${targets[@]}" | sort -u)
          for f in "${files[@]}"; do
            code=0
            python3 tools/run-trace.py "$f" > "$out" 2>&1 || code=$?
            echo "── run-trace: $f (exit $code)"
            cat "$out"
            [ "$code" = "2" ] && continue
            [ "$code" = "0" ] || rc=1
          done
          echo "runtrace_exit=$rc" >> "$GITHUB_OUTPUT"
          exit $rc

      # ---- Plain-language summary for a director who cannot read code ---------
      - name: Write human-readable summary
        if: always()
        run: |
          {
            echo "## Enforcement floor result"
            echo ""
            if [ "${{ steps.structure.outputs.structure_exit }}" = "0" ]; then
              echo "### ✅ Structure: HELD — known problems did not get worse"
              echo "No new god-files, tangled functions, deep nesting, circular imports, copy-paste blocks, or code hidden inside strings — and nothing already on the debt ledger grew."
            else
              echo "### ⚠️ Structure: REGRESSED — the shape got worse"
              echo "Either a NEW structural problem appeared, or one this project already agreed to freeze grew anyway. Unlike a plain flag this needs no judgement call to stand: a number the project froze has moved. See \`DEBT_LEDGER.md\` for what was accepted and why. Details:"
            fi
            echo ""
            echo '```'
            cat structure.out 2>/dev/null || echo "(structure report unavailable)"
            echo '```'
            echo ""
            if [ "${{ steps.runtrace.outputs.runtrace_exit }}" = "0" ]; then
              echo "### ✅ Run completeness: all traced transcripts complete"
            else
              echo "### ⚠️ Run completeness: one or more transcripts incomplete — a required stage was skipped or not reported"
            fi
            echo ""
            echo "_A flag means 'a reviewer should look,' not 'this is definitely wrong' — Chesterton's Fence (suite Law 3). This gate measures shape; senior-review owns the wisdom call._"
          } >> "$GITHUB_STEP_SUMMARY"
